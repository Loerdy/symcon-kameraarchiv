<!-- Tile of a camera instance, also used by the console for the overview of all cameras.
     Fragment like the official HTML-SDK examples: the body margins of the visualization (space for the tile title)
     as well as text color and font of the design are kept. Surfaces are derived from the inherited text color. -->
<style>
    html {
        height: 100%;
    }

    body {
        height: calc(100% - var(--body-margins, 0px));
        overflow: hidden;
    }

    #app {
        --surface: rgba(127, 127, 127, 0.2);
        --surface: color-mix(in srgb, currentColor 12%, transparent);
        --accent: #1f6fd6;
        display: flex;
        flex-direction: column;
        gap: 6px;
        height: 100%;
    }

    #chips {
        position: relative;
        display: flex;
        flex: none;
        gap: 6px;
        overflow-x: auto;
    }

    /* Scrollbars would cover the content on desktop systems: scrolling works by swiping or with the mouse wheel */
    .scroller {
        scrollbar-width: none;
    }

    .scroller::-webkit-scrollbar {
        display: none;
    }

    .chip {
        flex: none;
        padding: 4px 12px;
        border: none;
        border-radius: 14px;
        background: var(--surface);
        color: inherit;
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
    }

    /* Fixed colors: white on the accent color is readable in every design */
    .chip.active {
        background: var(--accent);
        color: #ffffff;
    }

    #main {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        min-height: 0;
        border-radius: 8px;
        background: var(--surface);
        overflow: hidden;
    }

    #image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: zoom-in;
    }

    #message {
        padding: 12px;
        opacity: 0.7;
        text-align: center;
    }

    .badges {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        pointer-events: none;
    }

    /* Badges lie on the image, therefore fixed colors with enough contrast in every design */
    .badge {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.65);
        color: #ffffff;
        font-size: 12px;
    }

    /* Action buttons lie on the image like the badges: fixed colors with enough contrast in every design */
    .actions {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
    }

    .action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 36px;
        height: 36px;
        padding: 0 8px;
        border: none;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        font: inherit;
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
    }

    .action svg {
        flex: none;
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .action.on {
        background: var(--accent);
    }

    .action.on svg {
        fill: currentColor;
    }

    .action.confirm {
        background: #c62828;
    }

    .action:disabled {
        cursor: default;
    }

    .action.busy svg {
        animation: busy 1s linear infinite;
    }

    @keyframes busy {
        to {
            transform: rotate(360deg);
        }
    }

    #notice {
        position: absolute;
        top: 52px;
        left: 8px;
        right: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(198, 40, 40, 0.92);
        color: #ffffff;
        font-size: 13px;
    }

    #bar {
        display: flex;
        flex: none;
        gap: 6px;
        align-items: stretch;
        height: 64px;
    }

    #filter {
        flex: none;
        max-width: 35%;
        border: none;
        border-radius: 6px;
        background: var(--surface);
        color: inherit;
        font: inherit;
    }

    #dateSelect {
        flex: none;
        max-width: 35%;
        border: none;
        border-radius: 6px;
        background: var(--surface);
        color: inherit;
        font: inherit;
    }

    .mode {
        flex: none;
        padding: 0 10px;
        border: none;
        border-radius: 6px;
        background: var(--surface);
        color: inherit;
        font: inherit;
        cursor: pointer;
    }

    /* Fixed colors: white on the accent color is readable in every design */
    .mode.on {
        background: var(--accent);
        color: #ffffff;
    }

    /* The option list is drawn by the system: fixed colors so that it stays readable */
    #dateSelect option,
    #filter option {
        background: #ffffff;
        color: #1f1f1f;
    }

    #strip {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        gap: 4px;
        overflow-x: auto;
    }

    .thumb {
        position: relative;
        flex: none;
        height: 100%;
        aspect-ratio: 16 / 9;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 4px;
        background: var(--surface);
        overflow: hidden;
        cursor: pointer;
    }

    .thumb.active {
        border-color: var(--accent);
    }

    .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .thumb span {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        color: #ffffff;
        font-size: 10px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
    }

    /* Enlarged view: covers the tile, or the whole screen if the browser allows fullscreen for the tile.
       Always dark, independent of the design, like common image viewers. */
    #viewer {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
        touch-action: pan-y pinch-zoom;
    }

    #viewerImage {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: zoom-out;
    }

    .viewer-button {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: none;
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        font: 28px/1 sans-serif;
        cursor: pointer;
    }

    #viewerClose {
        top: 8px;
        right: 8px;
        font-size: 22px;
    }

    #viewerPrev {
        left: 8px;
        top: calc(50% - 22px);
    }

    #viewerNext {
        right: 8px;
        top: calc(50% - 22px);
    }

    .hidden {
        display: none !important;
    }

    @media (max-height: 280px) {
        #bar {
            display: none;
        }
    }
</style>
<div id="app">
    <div id="chips" class="scroller"></div>
    <div id="main">
        <img id="image" class="hidden" alt="">
        <div id="message"></div>
        <div id="badges" class="badges hidden">
            <span id="badgeTrigger" class="badge"></span>
            <span id="badgeTime" class="badge"></span>
            <span id="badgeKeep" class="badge"></span>
        </div>
        <div id="actions" class="actions">
            <button id="actionLive" class="action" type="button">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>
            </button>
            <button id="actionSnapshot" class="action" type="button">
                <svg viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="actionKeep" class="action" type="button">
                <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
            </button>
            <button id="actionDownload" class="action" type="button">
                <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
            </button>
            <button id="actionDelete" class="action" type="button">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
                <span id="actionDeleteLabel" class="hidden"></span>
            </button>
        </div>
        <div id="notice" class="hidden"></div>
    </div>
    <div id="bar">
        <button id="modeToggle" class="mode hidden" type="button"></button>
        <select id="dateSelect" class="hidden"></select>
        <select id="filter"></select>
        <div id="strip" class="scroller"></div>
    </div>
</div>
<div id="viewer" class="hidden">
    <img id="viewerImage" alt="">
    <div id="viewerBadges" class="badges">
        <span id="viewerCamera" class="badge"></span>
        <span id="viewerTrigger" class="badge"></span>
        <span id="viewerTime" class="badge"></span>
    </div>
    <button id="viewerPrev" class="viewer-button" type="button">&#8249;</button>
    <button id="viewerNext" class="viewer-button" type="button">&#8250;</button>
    <button id="viewerClose" class="viewer-button" type="button">&#10005;</button>
</div>
<script>
    // The body keeps the margins of the visualization; its height is reduced by them so that nothing is cut off
    (function () {
        const style = getComputedStyle(document.body);
        const margins = parseFloat(style.marginTop) + parseFloat(style.marginBottom);
        document.documentElement.style.setProperty('--body-margins', (isNaN(margins) ? 0 : margins) + 'px');
    })();

    // State of the module: cameras with name, image WebHook (hook, token) and images, newest first.
    // "overview" is true for the tile of the console that shows all cameras.
    const tile = { cameras: [], overview: false };
    // Selected camera, selected image (null: always show the newest), trigger filter ('' = all), enlarged view
    // "mode": 'latest' shows the images in RAM, 'archive' the images of one day on the NAS
    const view = { camera: null, seq: null, filter: '', viewer: false, fullscreen: false, mode: 'latest' };
    // Archive of the selected camera: days with images, selected day and its images. Every request has its own ID;
    // answers to other requests (e.g. of another viewer of the same instance) are ignored.
    const archive = { camera: null, days: [], date: '', files: [], loading: false, error: '', request: '', timer: null, counter: 0 };
    const ARCHIVE_TIMEOUT_MS = 20000;
    // Live view: images are loaded one after another (about one per second) as long as the tile is visible,
    // at most LIVE_MAX_MS. After LIVE_MAX_ERRORS failed images in a row it stops.
    const live = { camera: null, running: false, url: '', time: null, errors: 0, timer: null, stopTimer: null };
    const LIVE_INTERVAL_MS = 1000;
    const LIVE_MAX_MS = 120000;
    const LIVE_MAX_ERRORS = 3;
    // Actions: snapshot requested per camera (newest sequence number at the request), delete waiting for the
    // second tap, notices already shown per camera
    const actions = { busy: {}, confirm: null, confirmTimer: null, notices: {}, noticeTimer: null };
    // Without an answer the busy display ends after this time (the camera answers within the curl timeouts)
    const SNAPSHOT_BUSY_MS = 20000;

    function text(original) {
        return typeof translate === 'function' ? translate(original) : original;
    }

    function handleMessage(message) {
        let data = message;
        if (typeof message === 'string') {
            try {
                data = JSON.parse(message);
            } catch (error) {
                return;
            }
        }
        if (data === null || typeof data !== 'object') {
            return;
        }
        if (data.archive) {
            handleArchive(data.archive);
            return;
        }
        tile.cameras = Array.isArray(data.cameras) ? data.cameras : [];
        tile.overview = data.overview === true;
        for (const camera of tile.cameras) {
            const busy = actions.busy[camera.id];
            if (busy && camera.images.some((image) => image.seq > busy.seq)) {
                clearBusy(camera.id);
            }
            const notice = camera.notice;
            if (notice && typeof notice.id === 'string' && actions.notices[camera.id] !== notice.id) {
                actions.notices[camera.id] = notice.id;
                clearBusy(camera.id);
                showNotice((tile.cameras.length > 1 ? camera.name + ': ' : '') + notice.text);
            }
        }
        render();
    }

    function clearBusy(cameraID) {
        if (actions.busy[cameraID]) {
            clearTimeout(actions.busy[cameraID].timer);
            delete actions.busy[cameraID];
        }
    }

    function showNotice(message) {
        const notice = document.getElementById('notice');
        notice.textContent = message;
        notice.classList.remove('hidden');
        clearTimeout(actions.noticeTimer);
        actions.noticeTimer = setTimeout(() => notice.classList.add('hidden'), 8000);
    }

    // The camera instance (or the console for the overview) validates the values before changing anything
    function sendAction(ident, camera, values) {
        if (typeof requestAction !== 'function') {
            return;
        }
        requestAction(ident, JSON.stringify(Object.assign({ camera: camera.id }, values)));
    }

    // Images in RAM by slot and sequence number, archive images by day and file name (thumb: preview)
    function imageUrl(camera, image, thumb) {
        const params = image.archive
            ? { token: camera.token, archive: '1', date: image.date, file: image.file }
            : { token: camera.token, slot: image.slot, seq: image.seq };
        if (image.archive && thumb) {
            params.thumb = '1';
        }
        return camera.hook + '?' + new URLSearchParams(params).toString();
    }

    function archiveImages(camera) {
        if (archive.camera !== camera.id) {
            return [];
        }
        return archive.files.map((entry) => ({
            seq: 'a:' + archive.date + '/' + entry.file,
            archive: true,
            date: archive.date,
            file: entry.file,
            time: entry.time,
            trigger: entry.trigger
        }));
    }

    function liveActive(camera) {
        return live.running && camera !== null && live.camera === camera.id;
    }

    function startLive(camera) {
        stopLive();
        live.running = true;
        live.camera = camera.id;
        live.errors = 0;
        live.stopTimer = setTimeout(() => {
            stopLive();
            render();
        }, LIVE_MAX_MS);
        loadLiveImage(camera);
    }

    function stopLive() {
        live.running = false;
        clearTimeout(live.timer);
        clearTimeout(live.stopTimer);
        if (live.url !== '') {
            URL.revokeObjectURL(live.url);
        }
        live.url = '';
        live.time = null;
    }

    // Loads the next image; the following one is requested when this one has arrived, so slow answers do not pile up
    function loadLiveImage(camera) {
        if (!liveActive(camera)) {
            return;
        }
        const started = Date.now();
        const query = new URLSearchParams({ token: camera.token, live: '1', t: String(started) });
        fetch(camera.hook + '?' + query.toString(), { cache: 'no-store' }).then((response) => {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.blob();
        }).then((blob) => {
            if (!liveActive(camera)) {
                return;
            }
            if (live.url !== '') {
                URL.revokeObjectURL(live.url);
            }
            live.url = URL.createObjectURL(blob);
            live.time = Date.now() / 1000;
            live.errors = 0;
            render();
        }).catch(() => {
            if (!liveActive(camera)) {
                return;
            }
            live.errors++;
            if (live.errors >= LIVE_MAX_ERRORS) {
                stopLive();
                showNotice(text('Live image not available'));
                render();
            }
        }).finally(() => {
            if (liveActive(camera)) {
                live.timer = setTimeout(() => loadLiveImage(camera), Math.max(0, LIVE_INTERVAL_MS - (Date.now() - started)));
            }
        });
    }

    // Images of the current mode, newest first
    function cameraImages(camera) {
        return view.mode === 'archive' ? archiveImages(camera) : camera.images;
    }

    function requestArchive(camera, date) {
        archive.counter++;
        archive.request = 'r' + Date.now().toString(36) + archive.counter + Math.random().toString(36).slice(2, 6);
        archive.camera = camera.id;
        archive.loading = true;
        archive.error = '';
        archive.files = [];
        if (date === '') {
            archive.days = [];
            archive.date = '';
        }
        clearTimeout(archive.timer);
        archive.timer = setTimeout(() => {
            if (archive.loading) {
                archive.loading = false;
                archive.error = text('No answer');
                render();
            }
        }, ARCHIVE_TIMEOUT_MS);
        sendAction('ArchiveList', camera, { request: archive.request, date: date });
    }

    // Answer of the module: days (request without date) or the images of a day
    function handleArchive(answer) {
        if (typeof answer.request !== 'string' || answer.request !== archive.request) {
            return;
        }
        clearTimeout(archive.timer);
        archive.loading = false;
        if (answer.ok !== true) {
            archive.error = typeof answer.message === 'string' ? answer.message : '';
            render();
            return;
        }
        const items = Array.isArray(answer.items) ? answer.items : [];
        if (answer.date === '') {
            archive.days = items.filter((day) => typeof day === 'string');
            const camera = tile.cameras.find((entry) => entry.id === archive.camera);
            if (archive.days.length > 0 && camera) {
                archive.date = archive.days[0];
                requestArchive(camera, archive.date);
            }
        } else {
            archive.files = items.filter((entry) => entry && typeof entry.file === 'string'
                && typeof entry.time === 'number' && typeof entry.trigger === 'string');
        }
        render();
    }

    function triggerLabel(trigger) {
        return trigger === 'manual' ? text('Manual') : trigger;
    }

    function formatTime(time, short) {
        const date = new Date(time * 1000);
        if (!short) {
            return date.toLocaleString([], { dateStyle: 'short', timeStyle: 'medium' });
        }
        const clock = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (date.toDateString() === new Date().toDateString()) {
            return clock;
        }
        return date.toLocaleDateString([], { day: '2-digit', month: '2-digit' }) + ' ' + clock;
    }

    // Keeps the active element of a horizontal list visible (the lists are rebuilt on every update)
    function scrollToActive(list) {
        const active = list.querySelector('.active');
        if (!active) {
            return;
        }
        if (active.offsetLeft < list.scrollLeft) {
            list.scrollLeft = active.offsetLeft;
        } else if (active.offsetLeft + active.offsetWidth > list.scrollLeft + list.clientWidth) {
            list.scrollLeft = active.offsetLeft + active.offsetWidth - list.clientWidth;
        }
    }

    // The mouse wheel scrolls the horizontal lists, as their scrollbars are hidden
    for (const list of document.querySelectorAll('.scroller')) {
        list.addEventListener('wheel', (event) => {
            if (Math.abs(event.deltaY) > Math.abs(event.deltaX) && list.scrollWidth > list.clientWidth) {
                list.scrollLeft += event.deltaY;
                event.preventDefault();
            }
        }, { passive: false });
    }

    function showMessage(message) {
        document.getElementById('image').classList.add('hidden');
        document.getElementById('badges').classList.add('hidden');
        const element = document.getElementById('message');
        element.textContent = message;
        element.classList.remove('hidden');
    }

    function renderChips() {
        const chips = document.getElementById('chips');
        chips.replaceChildren();
        chips.classList.toggle('hidden', tile.cameras.length < 2);
        for (const camera of tile.cameras) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip' + (camera.id === view.camera ? ' active' : '');
            chip.textContent = camera.name;
            chip.addEventListener('click', () => {
                stopLive();
                view.camera = camera.id;
                view.seq = null;
                view.filter = '';
                // The archive follows the selected camera
                if (view.mode === 'archive') {
                    if (camera.nas === true) {
                        requestArchive(camera, '');
                    } else {
                        view.mode = 'latest';
                    }
                }
                render();
            });
            chips.appendChild(chip);
        }
        scrollToActive(chips);
    }

    // Switch between the images in RAM and the archive; the day selection of the archive
    function renderMode(camera) {
        const toggle = document.getElementById('modeToggle');
        toggle.classList.toggle('hidden', camera.nas !== true);
        toggle.classList.toggle('on', view.mode === 'archive');
        toggle.textContent = view.mode === 'archive' ? text('Latest') : text('Archive');
        toggle.title = view.mode === 'archive' ? text('Back to the latest images') : text('Older images on the NAS');

        const select = document.getElementById('dateSelect');
        select.classList.toggle('hidden', view.mode !== 'archive' || archive.days.length === 0);
        select.replaceChildren();
        for (const day of archive.days) {
            const option = document.createElement('option');
            option.value = day;
            option.textContent = new Date(day + 'T00:00:00').toLocaleDateString([], { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
            select.appendChild(option);
        }
        select.value = archive.date;
    }

    function renderFilter(camera) {
        const triggers = [...new Set(cameraImages(camera).map((image) => image.trigger))];
        if (!triggers.includes(view.filter)) {
            view.filter = '';
        }
        const select = document.getElementById('filter');
        select.replaceChildren();
        const all = document.createElement('option');
        all.value = '';
        all.textContent = text('All triggers');
        select.appendChild(all);
        for (const trigger of triggers) {
            const option = document.createElement('option');
            option.value = trigger;
            option.textContent = triggerLabel(trigger);
            select.appendChild(option);
        }
        select.value = view.filter;
        select.classList.toggle('hidden', triggers.length < 2);
    }

    // Selects an image of the filtered list; the newest image means "always show the newest"
    function selectImage(images, image) {
        view.seq = image === images[0] ? null : image.seq;
    }

    function renderStrip(camera, images, selected) {
        const strip = document.getElementById('strip');
        strip.replaceChildren();
        for (const image of images) {
            const thumb = document.createElement('button');
            thumb.type = 'button';
            thumb.className = 'thumb' + (image === selected ? ' active' : '');
            const picture = document.createElement('img');
            picture.loading = 'lazy';
            picture.alt = '';
            picture.src = imageUrl(camera, image, true);
            const label = document.createElement('span');
            label.textContent = formatTime(image.time, true);
            thumb.title = triggerLabel(image.trigger) + ' – ' + formatTime(image.time, false);
            thumb.append(picture, label);
            thumb.addEventListener('click', () => {
                stopLive();
                selectImage(images, image);
                render();
            });
            strip.appendChild(thumb);
        }
        scrollToActive(strip);
    }

    // Current camera, its filtered images and the selected image
    function currentSelection() {
        const camera = tile.cameras.find((entry) => entry.id === view.camera);
        if (!camera) {
            return { camera: null, images: [], selected: null };
        }
        const images = cameraImages(camera).filter((image) => view.filter === '' || image.trigger === view.filter);
        let selected = images.find((image) => image.seq === view.seq);
        if (!selected) {
            view.seq = null;
            selected = images[0] || null;
        }
        return { camera, images, selected };
    }

    function render() {
        if (!tile.cameras.some((camera) => camera.id === view.camera)) {
            view.camera = tile.cameras.length > 0 ? tile.cameras[0].id : null;
            view.seq = null;
        }
        renderChips();

        const bar = document.getElementById('bar');
        const camera = tile.cameras.find((entry) => entry.id === view.camera);
        if (!camera) {
            bar.classList.add('hidden');
            document.getElementById('actions').classList.add('hidden');
            closeViewer();
            showMessage(text(tile.overview ? 'No cameras yet. Create the camera instances with the configurator.' : 'No camera'));
            return;
        }

        if (view.mode === 'archive' && camera.nas !== true) {
            view.mode = 'latest';
        }
        renderMode(camera);
        renderFilter(camera);
        const { images, selected } = currentSelection();

        // The bar also carries the switch to the archive, so it stays visible without images in RAM
        bar.classList.toggle('hidden', view.mode !== 'archive' && camera.images.length === 0 && camera.nas !== true);
        renderStrip(camera, images, selected);
        renderViewer();
        renderActions(camera, selected);

        if (liveActive(camera)) {
            renderLive();
            return;
        }
        if (!selected) {
            showMessage(emptyMessage(camera));
            return;
        }

        const picture = document.getElementById('image');
        const url = imageUrl(camera, selected);
        if (picture.getAttribute('src') !== url) {
            delete picture.dataset.failed;
            picture.src = url;
        } else if (picture.dataset.failed === 'true') {
            showMessage(text('Image not available'));
            return;
        }
        picture.classList.remove('hidden');
        document.getElementById('message').classList.add('hidden');
        document.getElementById('badgeTrigger').textContent = triggerLabel(selected.trigger);
        document.getElementById('badgeTime').textContent = formatTime(selected.time, false);
        document.getElementById('badgeKeep').textContent = text('Kept');
        document.getElementById('badgeKeep').classList.toggle('hidden', !selected.keep);
        document.getElementById('badges').classList.remove('hidden');
    }

    // Live view in the large image: badge "Live" and the time the image arrived
    function renderLive() {
        if (live.url === '') {
            showMessage(text('Loading live image …'));
            return;
        }
        const picture = document.getElementById('image');
        if (picture.getAttribute('src') !== live.url) {
            delete picture.dataset.failed;
            picture.src = live.url;
        }
        picture.classList.remove('hidden');
        document.getElementById('message').classList.add('hidden');
        document.getElementById('badgeTrigger').textContent = text('Live');
        document.getElementById('badgeTime').textContent = formatTime(live.time, false);
        document.getElementById('badgeKeep').classList.add('hidden');
        document.getElementById('badges').classList.remove('hidden');
    }

    function emptyMessage(camera) {
        if (view.mode !== 'archive') {
            return text(camera.indexDamaged ? 'The image index is damaged.' : 'No images yet');
        }
        if (archive.loading) {
            return text('Loading archive …');
        }
        if (archive.error !== '') {
            return text('Archive not available') + ': ' + archive.error;
        }
        return text(archive.days.length === 0 ? 'No images on the NAS yet' : 'No images on this day');
    }

    // Snapshot is always possible; keep, download and delete refer to the selected image.
    // Images of the archive can only be downloaded: the NAS already is the permanent storage.
    function renderActions(camera, selected) {
        document.getElementById('actions').classList.remove('hidden');
        const liveButton = document.getElementById('actionLive');
        liveButton.classList.toggle('hidden', camera.live !== true);
        liveButton.classList.toggle('on', liveActive(camera));
        liveButton.title = text(liveActive(camera) ? 'Stop live view' : 'Live view');
        // The live image is no stored image: keep, download and delete do not apply
        if (liveActive(camera)) {
            selected = null;
        }
        const snapshot = document.getElementById('actionSnapshot');
        const busy = Boolean(actions.busy[camera.id]);
        snapshot.classList.toggle('busy', busy);
        snapshot.disabled = busy;

        if (actions.confirm && (!selected || actions.confirm.camera !== camera.id || actions.confirm.seq !== selected.seq)) {
            resetConfirm();
        }
        const archived = Boolean(selected && selected.archive);
        document.getElementById('actionDownload').classList.toggle('hidden', !selected);
        for (const id of ['actionKeep', 'actionDelete']) {
            document.getElementById(id).classList.toggle('hidden', !selected || archived);
        }
        if (!selected || archived) {
            return;
        }
        const keep = document.getElementById('actionKeep');
        keep.classList.toggle('on', selected.keep);
        keep.title = text(selected.keep ? 'Do not keep image' : 'Keep image');
        const confirming = actions.confirm !== null;
        document.getElementById('actionDelete').classList.toggle('confirm', confirming);
        document.getElementById('actionDeleteLabel').classList.toggle('hidden', !confirming);
    }

    function resetConfirm() {
        clearTimeout(actions.confirmTimer);
        actions.confirm = null;
    }

    function takeSnapshot() {
        const { camera } = currentSelection();
        if (!camera || actions.busy[camera.id]) {
            return;
        }
        const newest = camera.images.reduce((max, image) => Math.max(max, image.seq), 0);
        const timer = setTimeout(() => {
            delete actions.busy[camera.id];
            render();
        }, SNAPSHOT_BUSY_MS);
        actions.busy[camera.id] = { seq: newest, timer };
        // The new image is shown as soon as it arrives
        view.mode = 'latest';
        view.seq = null;
        view.filter = '';
        sendAction('TileSnapshot', camera, {});
        render();
    }

    function toggleKeep() {
        const { camera, selected } = currentSelection();
        if (camera && selected) {
            sendAction('TileKeep', camera, { slot: selected.slot, seq: selected.seq, keep: !selected.keep });
        }
    }

    function downloadImage() {
        const { camera, selected } = currentSelection();
        if (!camera || !selected) {
            return;
        }
        const link = document.createElement('a');
        link.href = imageUrl(camera, selected) + '&download=1';
        link.download = '';
        document.body.appendChild(link);
        link.click();
        link.remove();
    }

    // First tap asks, the second tap within a few seconds deletes
    function deleteImage() {
        const { camera, selected } = currentSelection();
        if (!camera || !selected) {
            return;
        }
        if (actions.confirm && actions.confirm.camera === camera.id && actions.confirm.seq === selected.seq) {
            resetConfirm();
            sendAction('TileDelete', camera, { slot: selected.slot, seq: selected.seq });
        } else {
            resetConfirm();
            actions.confirm = { camera: camera.id, seq: selected.seq };
            actions.confirmTimer = setTimeout(() => {
                actions.confirm = null;
                render();
            }, 4000);
        }
        render();
    }

    // Enlarged view of the selected image. Fullscreen is requested if the browser allows it for the tile;
    // otherwise the view covers the tile.
    function openViewer() {
        const { camera, selected } = currentSelection();
        if (!selected && !(liveActive(camera) && live.url !== '')) {
            return;
        }
        view.viewer = true;
        renderViewer();
        const viewer = document.getElementById('viewer');
        if (document.fullscreenEnabled && typeof viewer.requestFullscreen === 'function') {
            viewer.requestFullscreen().then(() => {
                view.fullscreen = true;
            }).catch(() => {
                view.fullscreen = false;
            });
        }
    }

    function closeViewer() {
        if (!view.viewer) {
            return;
        }
        view.viewer = false;
        document.getElementById('viewer').classList.add('hidden');
        if (view.fullscreen && document.fullscreenElement) {
            view.fullscreen = false;
            document.exitFullscreen().catch(() => {});
        }
    }

    function renderViewer() {
        const viewer = document.getElementById('viewer');
        const { camera, images, selected } = currentSelection();
        if (view.viewer && liveActive(camera) && live.url !== '') {
            // Live view in fullscreen: no browsing
            const livePicture = document.getElementById('viewerImage');
            if (livePicture.getAttribute('src') !== live.url) {
                livePicture.src = live.url;
            }
            document.getElementById('viewerCamera').textContent = camera.name;
            document.getElementById('viewerCamera').classList.toggle('hidden', tile.cameras.length < 2);
            document.getElementById('viewerTrigger').textContent = text('Live');
            document.getElementById('viewerTime').textContent = formatTime(live.time, false);
            document.getElementById('viewerPrev').classList.add('hidden');
            document.getElementById('viewerNext').classList.add('hidden');
            viewer.classList.remove('hidden');
            return;
        }
        if (!view.viewer || !selected) {
            if (view.viewer) {
                closeViewer();
            }
            return;
        }
        const position = images.indexOf(selected);
        const picture = document.getElementById('viewerImage');
        const url = imageUrl(camera, selected);
        if (picture.getAttribute('src') !== url) {
            picture.src = url;
        }
        document.getElementById('viewerCamera').textContent = camera.name;
        document.getElementById('viewerCamera').classList.toggle('hidden', tile.cameras.length < 2);
        document.getElementById('viewerTrigger').textContent = triggerLabel(selected.trigger);
        document.getElementById('viewerTime').textContent = formatTime(selected.time, false);
        // The strip runs from new to old: "previous" is the newer, "next" the older image
        document.getElementById('viewerPrev').classList.toggle('hidden', position <= 0);
        document.getElementById('viewerNext').classList.toggle('hidden', position >= images.length - 1);
        viewer.classList.remove('hidden');
    }

    function stepViewer(step) {
        const { camera, images, selected } = currentSelection();
        if (liveActive(camera)) {
            return;
        }
        const target = images[images.indexOf(selected) + step];
        if (target) {
            selectImage(images, target);
            render();
        }
    }

    document.getElementById('modeToggle').addEventListener('click', () => {
        const { camera } = currentSelection();
        if (!camera) {
            return;
        }
        resetConfirm();
        stopLive();
        view.seq = null;
        view.filter = '';
        if (view.mode === 'archive') {
            view.mode = 'latest';
        } else {
            view.mode = 'archive';
            requestArchive(camera, '');
        }
        render();
    });

    document.getElementById('dateSelect').addEventListener('change', (event) => {
        const { camera } = currentSelection();
        if (!camera) {
            return;
        }
        archive.date = event.target.value;
        view.seq = null;
        view.filter = '';
        requestArchive(camera, archive.date);
        render();
    });

    document.getElementById('filter').addEventListener('change', (event) => {
        view.filter = event.target.value;
        view.seq = null;
        render();
    });

    document.getElementById('image').addEventListener('error', (event) => {
        event.target.dataset.failed = 'true';
        showMessage(text('Image not available'));
    });

    document.getElementById('image').addEventListener('click', openViewer);
    document.getElementById('viewerClose').addEventListener('click', closeViewer);
    document.getElementById('viewerPrev').addEventListener('click', () => stepViewer(-1));
    document.getElementById('viewerNext').addEventListener('click', () => stepViewer(1));
    document.getElementById('viewerPrev').title = text('Newer image');
    document.getElementById('viewerNext').title = text('Older image');
    document.getElementById('viewerClose').title = text('Close');
    document.getElementById('actionLive').addEventListener('click', () => {
        const { camera } = currentSelection();
        if (!camera) {
            return;
        }
        if (liveActive(camera)) {
            stopLive();
        } else {
            startLive(camera);
        }
        render();
    });
    // A hidden tile (other page, locked phone) ends the live view, so that no images are loaded unnoticed
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && live.running) {
            stopLive();
            render();
        }
    });
    document.getElementById('actionSnapshot').addEventListener('click', takeSnapshot);
    document.getElementById('actionKeep').addEventListener('click', toggleKeep);
    document.getElementById('actionDownload').addEventListener('click', downloadImage);
    document.getElementById('actionDelete').addEventListener('click', deleteImage);
    document.getElementById('actionSnapshot').title = text('Take snapshot');
    document.getElementById('actionDownload').title = text('Download');
    document.getElementById('actionDelete').title = text('Delete image');
    document.getElementById('actionDeleteLabel').textContent = text('Delete?');

    // Swiping changes the image, a tap on the image closes the view
    (function () {
        const viewerImage = document.getElementById('viewerImage');
        let startX = null;
        let swiped = false;
        viewerImage.addEventListener('touchstart', (event) => {
            startX = event.touches.length === 1 ? event.touches[0].clientX : null;
            swiped = false;
        }, { passive: true });
        viewerImage.addEventListener('touchend', (event) => {
            if (startX === null || event.changedTouches.length !== 1) {
                return;
            }
            const distance = event.changedTouches[0].clientX - startX;
            startX = null;
            if (Math.abs(distance) > 40) {
                swiped = true;
                stepViewer(distance < 0 ? 1 : -1);
            }
        });
        viewerImage.addEventListener('click', () => {
            if (!swiped) {
                closeViewer();
            }
            swiped = false;
        });
    })();

    document.addEventListener('keydown', (event) => {
        if (!view.viewer) {
            return;
        }
        if (event.key === 'Escape') {
            closeViewer();
        } else if (event.key === 'ArrowLeft') {
            stepViewer(-1);
        } else if (event.key === 'ArrowRight') {
            stepViewer(1);
        }
    });

    // Leaving fullscreen with the system (e.g. Escape or back gesture) also closes the view
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && view.fullscreen) {
            view.fullscreen = false;
            closeViewer();
        }
    });
</script>
